spring:
  application:
    name: tiger-music-tag-editor

server:
  # 仅监听回环地址；桌面壳与本地服务同机通信（BIZ-013）
  address: 127.0.0.1
  # 端口可配置：打包期由 Electron 主进程选定并注入（BIZ-013）
  port: ${TIGER_SERVER_PORT:8080}

app:
  security:
    # 本地接口访问 token（BIZ-013）：打包期由主进程注入 TIGER_APP_TOKEN；
    # 开发期为便于手动启动使用默认值；置空则关闭校验（仅限明确的无鉴权场景）
    token: ${TIGER_APP_TOKEN:dev-local-token}
